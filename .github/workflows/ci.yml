name: Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      # SAST — 静态应用安全测试
      - name: Run Bandit SAST scan
        run: |
          bandit -r . -f txt | tee bandit-report.txt
          bandit -r . -f json -o bandit-report.json
          echo "## Bandit SAST report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat bandit-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # SCA — 软件成分分析（依赖漏洞扫描，pip-audit 免费无需 API key）
      - name: Run pip-audit SCA scan
        run: |
          pip-audit -r requirements.txt -f markdown 2>/dev/null | tee sca-report.md || true
          pip-audit -r requirements.txt -f json 2>/dev/null | tee sca-report.json || true
          echo "## pip-audit SCA report" >> $GITHUB_STEP_SUMMARY
          cat sca-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: |
            bandit-report.txt
            bandit-report.json
            sca-report.md
            sca-report.json
